# Render Blueprint: Caliphate Rides road routing for Sokoto (free plan, for testing).
# In Render: New → Blueprint → pick this repository. See render/README.md.
services:
  - type: web
    name: caliphate-routing
    runtime: docker
    dockerfilePath: ./render/routing/Dockerfile
    dockerContext: ./render/routing
    region: frankfurt        # same region as the API, and closest to Nigeria
    plan: free               # sleeps after 15 min without requests; the API keeps it awake while it runs
    healthCheckPath: /nearest/v1/driving/5.2310,13.0482
